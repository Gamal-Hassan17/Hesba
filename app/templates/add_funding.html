{% extends 'base.html' %}
{% block title %}إضافة مبلغ مالي{% endblock %}
{% block content %}
<div class="form-shell"><a class="back-link" href="{{ url_for('accounts.detail', account_id=account.id) }}"><i class="bi bi-arrow-right ms-1"></i>العودة إلى {{ account.name }}</a>
<div class="form-card mt-3"><div class="form-title-icon green-icon"><i class="bi bi-cash-coin"></i></div><h1 class="h3 fw-bold mb-2">إضافة مبلغ مالي</h1><p class="text-muted mb-4">إضافة مبلغ جديد إلى بند <strong>{{ account.name }}</strong>.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label" for="amount">المبلغ المضاف بالجنيه</label><input class="form-control form-control-lg" id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="مثال: 20000" required></div>
<div class="mb-3"><label class="form-label" for="description">وصف الإضافة</label><input class="form-control form-control-lg" id="description" name="description" maxlength="500" placeholder="مثال: مبلغ إضافي من حساب آخر"></div>
<div class="mb-4"><label class="form-label" for="transaction_date">تاريخ ووقت الإضافة</label><input class="form-control form-control-lg" id="transaction_date" name="transaction_date" type="datetime-local"></div>
<button class="btn btn-primary btn-lg w-100" type="submit">حفظ الإضافة المالية</button>
</form></div></div>
{% endblock %}
