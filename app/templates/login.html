{% extends 'base.html' %}
{% block title %}تسجيل الدخول | حِسبة{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card card border-0 shadow-lg">
    <div class="card-body p-4 p-md-5">
      <div class="brand-icon mb-3"><i class="bi bi-wallet2"></i></div>
      <h1 class="h3 fw-bold text-center mb-2">حِسبة</h1>
      <p class="text-muted text-center mb-4">سجّل مصروفاتك بسهولة وفي أي وقت</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="username">اسم المستخدم</label>
          <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">كلمة المرور</label>
          <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit"><i class="bi bi-box-arrow-in-left ms-2"></i>تسجيل الدخول</button>
      </form>
      {% if not registration_closed %}
      <div class="text-center mt-3"><a href="{{ url_for('auth.register') }}" class="fw-bold">أول مرة تستخدم النظام؟ أنشئ حساب المدير</a></div>
      {% endif %}
      <p class="small text-muted text-center mt-4 mb-0"><i class="bi bi-shield-lock ms-1"></i>هذا النظام مخصص للاستخدام الشخصي.</p>
    </div>
  </div>
</div>
{% endblock %}
