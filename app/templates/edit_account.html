{% extends 'base.html' %}
{% block title %}تعديل بيانات البند{% endblock %}
{% block content %}
<div class="form-shell"><a class="back-link" href="{{ url_for('accounts.detail', account_id=account.id) }}"><i class="bi bi-arrow-right ms-1"></i>العودة للبند</a>
<div class="form-card mt-3"><div class="form-title-icon"><i class="bi bi-pencil-square"></i></div><h1 class="h3 fw-bold mb-2">تعديل بيانات البند</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label" for="name">اسم البند المالي</label><input class="form-control form-control-lg" id="name" name="name" maxlength="120" value="{{ account.name }}" required></div>
<div class="mb-4"><label class="form-label" for="description">الوصف</label><textarea class="form-control" id="description" name="description" maxlength="500" rows="3">{{ account.description }}</textarea></div>
<button class="btn btn-primary btn-lg w-100" type="submit">حفظ التعديلات</button></form></div></div>
{% endblock %}
