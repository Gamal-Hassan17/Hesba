{% extends 'base.html' %}
{% block title %}إضافة مصروف{% endblock %}
{% block content %}
<div class="form-shell"><a class="back-link" href="{{ url_for('accounts.detail', account_id=account.id) }}"><i class="bi bi-arrow-right ms-1"></i>العودة إلى {{ account.name }}</a>
<div class="form-card mt-3"><div class="form-title-icon orange-icon"><i class="bi bi-receipt-cutoff"></i></div><h1 class="h3 fw-bold mb-2">إضافة مصروف</h1><p class="text-muted mb-4">سيتم تسجيل المصروف داخل بند <strong>{{ account.name }}</strong> فقط.</p>
<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label" for="amount">المبلغ بالجنيه <span class="text-danger">*</span></label><div class="input-group input-group-lg"><span class="input-group-text">ج.م</span><input class="form-control" id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="مثال: 1000" required autofocus></div></div>
<div class="mb-3"><label class="form-label" for="description">وصف المصروف <span class="text-danger">*</span></label><input class="form-control form-control-lg" id="description" name="description" maxlength="500" placeholder="مثال: شراء أكل" required></div>
<div class="mb-4"><label class="form-label" for="expense_date">تاريخ ووقت المصروف</label><input class="form-control form-control-lg" id="expense_date" name="expense_date" type="datetime-local"></div>
<div class="mb-4"><label class="form-label" for="receipt">صورة الفاتورة أو الإيصال (اختياري)</label><input class="form-control form-control-lg" id="receipt" name="receipt" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf"><div class="form-text">الأنواع المدعومة: JPG وPNG وWEBP وPDF، بحد أقصى 5 ميجابايت.</div></div>
<button class="btn btn-primary btn-lg w-100" type="submit"><i class="bi bi-check2-circle ms-2"></i>حفظ المصروف</button>
</form></div></div>
{% endblock %}
